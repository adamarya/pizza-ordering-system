# Local PostgreSQL 16 for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza
      POSTGRES_DB: pizza
    ports:
      - "5432:5432"
    volumes:
      - pizza-db:/var/lib/postgresql/data
volumes:
  pizza-db:
